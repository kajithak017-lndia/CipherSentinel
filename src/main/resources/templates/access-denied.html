<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Access Denied - CipherSentinel</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #050914;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: 'Segoe UI', sans-serif;
			color: white;
		}

		/* Background Grid */
		.grid-bg {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;

			background-image:
				linear-gradient(rgba(0, 212, 255, 0.03) 1px,
					transparent 1px),
				linear-gradient(90deg,
					rgba(0, 212, 255, 0.03) 1px,
					transparent 1px);

			background-size: 40px 40px;
		}

		/* Card */
		.denied-card {
			position: relative;
			z-index: 1;

			width: 520px;
			max-width: 90%;

			background: rgba(13, 21, 38, 0.95);

			border: 1px solid rgba(255, 76, 106, 0.25);

			border-radius: 18px;

			padding: 40px;

			text-align: center;

			box-shadow:
				0 0 40px rgba(255, 76, 106, 0.12);
		}

		.icon {
			font-size: 4rem;
			margin-bottom: 15px;
		}

		.title {
			color: #ff4c6a;
			font-size: 2rem;
			font-weight: 800;
			margin-bottom: 10px;
		}

		.subtitle {
			color: #00d4ff;
			font-size: 0.9rem;
			margin-bottom: 25px;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.desc {
			color: #c8d8f0;
			line-height: 1.7;
			margin-bottom: 15px;
		}

		.warning {
			margin-top: 20px;
			padding: 12px;

			background:
				rgba(255, 76, 106, 0.08);

			border:
				1px solid rgba(255, 76, 106, 0.2);

			border-radius: 10px;

			color: #ff9dad;
			font-size: 0.85rem;
		}

		.btn-dashboard {
			display: inline-block;

			margin-top: 25px;

			background:
				linear-gradient(135deg,
					#00d4ff,
					#7b61ff);

			color: white;
			text-decoration: none;

			padding: 12px 24px;

			border-radius: 8px;

			font-weight: 600;

			transition: 0.3s;
		}

		.btn-dashboard:hover {
			color: white;
			transform: translateY(-2px);

			box-shadow:
				0 0 20px rgba(0, 212, 255, 0.35);
		}

		@media (max-width:768px) {

			.denied-card {
				width: 90%;
				padding: 25px;
			}

			.title {
				font-size: 1.6rem;
			}

			.icon {
				font-size: 3rem;
			}
		}
	</style>
</head>

<body>

	<div class="grid-bg"></div>

	<div class="denied-card">

		<div class="icon">
			🚫
		</div>

		<div class="title">
			Access Denied
		</div>

		<div class="subtitle">
			Restricted Area
		</div>

		<div class="desc">
			You do not currently have permission
			to access this section.
		</div>

		<div class="desc">
			Your account role does not include
			the required privileges for this page.
		</div>

		<div class="warning">
			🛡️ CipherSentinel Security Protection
			has blocked this request.
		</div>

		<a href="/dashboard" class="btn-dashboard">
			← Return to Dashboard
		</a>

	</div>

</body>

</html>
