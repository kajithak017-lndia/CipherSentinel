<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for a Service - CipherSentinel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050914; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .grid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; }
        .navbar-custom { background: rgba(13, 21, 38, 0.98); border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 0 30px; height: 60px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 999; }
        .nav-brand { font-size: 1.2rem; font-weight: 800; color: #00d4ff; letter-spacing: 2px; }
        .nav-brand span { color: #7b61ff; }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        .btn-nav { background: transparent; border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff;
            padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.82rem;
            transition: all 0.2s; white-space: nowrap; }
        .btn-nav:hover { background: rgba(0, 212, 255, 0.1); color: #00d4ff; }
        .main-content { position: relative; z-index: 1; padding: 24px 30px; }
        .welcome-text { font-size: 1.4rem; font-weight: 700; color: #00d4ff; margin-bottom: 3px; }
        .sub-text { color: #7a8aaa; font-size: 0.85rem; margin-bottom: 24px; }
        .service-card { background: rgba(13, 21, 38, 0.9); border: 1px solid rgba(0, 212, 255, 0.18);
            border-radius: 12px; padding: 22px; height: 100%; display: flex; flex-direction: column;
            transition: all 0.25s; }
        .service-card:hover { border-color: #00d4ff; box-shadow: 0 0 16px rgba(0, 212, 255, 0.12);
            transform: translateY(-2px); }
        .service-icon { font-size: 2rem; margin-bottom: 10px; }
        .service-name { font-size: 1.05rem; font-weight: 700; color: white; margin-bottom: 6px; }
        .service-desc { color: #7a8aaa; font-size: 0.82rem; margin-bottom: 14px; flex-grow: 1; }
        .doc-chip { display: inline-block; background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.25);
            color: #00d4ff; font-size: 0.68rem; padding: 3px 10px; border-radius: 20px; margin: 3px 4px 0 0; }
        .btn-apply { margin-top: 16px; width: 100%; background: linear-gradient(135deg, #00d4ff, #7b61ff);
            border: none; color: white; font-weight: 700; padding: 10px; border-radius: 8px; font-size: 0.88rem; }
        .btn-apply:hover { opacity: 0.9; color: white; }
        .alert-error-box { background: rgba(255, 76, 106, 0.12); border-left: 4px solid #ff4c6a; color: #ffb3bf;
            padding: 12px 18px; border-radius: 10px; margin-bottom: 20px; }
        @media (max-width:768px) {
            .navbar-custom { height: auto; padding: 15px; }
            .nav-brand { font-size: 1.05rem; margin-bottom: 10px; }
            .main-content { padding: 15px; }
            .welcome-text { font-size: 1.15rem; }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>

    <div class="navbar-custom">
        <div class="nav-brand">🛡️ CIPHER<span>SENTINEL</span></div>
        <div class="nav-right">
            <a href="/dashboard" class="btn-nav"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/documents" class="btn-nav"><i class="fas fa-file-alt"></i> Documents</a>
        </div>
    </div>

    <div class="main-content">
        <div class="welcome-text"><i class="fas fa-landmark"></i> Apply for a Banking Service</div>
        <div class="sub-text">Choose a service below to start a new application.</div>

        <div th:if="${error}" class="alert-error-box" th:text="${error}"></div>

        <div class="row g-3">
            <div class="col-md-4" th:each="service : ${services}">
                <div class="service-card">
                    <div class="service-icon" th:text="${service.icon}">🏦</div>
                    <div class="service-name" th:text="${service.serviceName}">Service Name</div>
                    <div class="service-desc" th:text="${service.description}">Description</div>
                    <div>
                        <span class="doc-chip" th:each="doc : ${service.requiredDocumentsList}" th:text="${doc}">DOC</span>
                    </div>
                    <form th:action="@{/apply}" method="post">
                        <input type="hidden" name="serviceId" th:value="${service.id}" />
                        <button type="submit" class="btn-apply">Apply Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
