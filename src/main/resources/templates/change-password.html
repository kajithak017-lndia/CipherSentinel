<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Change Password - CipherSentinel</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #050914;
			color: white;
			font-family: 'Segoe UI', sans-serif;
			min-height: 100vh;
		}

		.grid-bg {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			background-image:
				linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
			background-size: 40px 40px;
			pointer-events: none;
		}

		.navbar-custom {
			background: rgba(13, 21, 38, 0.95);
			border-bottom: 1px solid rgba(0, 212, 255, 0.2);
			padding: 15px 30px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			position: sticky;
			top: 0;
			z-index: 100;
		}

		.nav-brand {
			font-size: 1.3rem;
			font-weight: 800;
			color: #00d4ff;
		}

		.nav-brand span {
			color: #7b61ff;
		}

		.nav-right {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.user-icon {
			width: 42px;
			height: 42px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			background: linear-gradient(135deg, #00d4ff, #7b61ff);
			border-radius: 50%;
			transition: all .3s ease;
		}

		.user-icon i {
			color: white;
			font-size: 1rem;
		}

		.navbar-profile-pic {
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 50%;
		}

		.btn-nav {
			background: transparent;
			border: 1px solid rgba(0, 212, 255, 0.3);
			color: #00d4ff;
			padding: 6px 16px;
			border-radius: 6px;
			text-decoration: none;
			font-size: 0.85rem;
		}

		.main-content {
			position: relative;
			z-index: 1;
			padding: 40px 30px;
			display: flex;
			justify-content: center;
		}

		.card {
			background: #0d1526;
			border: 1px solid rgba(0, 212, 255, 0.2);
			border-radius: 16px;
			padding: 36px;
			width: 100%;
			max-width: 480px;
		}

		.card-title {
			color: #00d4ff;
			font-size: 1.4rem;
			font-weight: 700;
			margin-bottom: 6px;
		}

		.card-sub {
			color: #7a8aaa;
			font-size: 0.88rem;
			margin-bottom: 28px;
		}

		.form-label-custom {
			color: #7a8aaa;
			font-size: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 8px;
			display: block;
		}

		.form-input {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(0, 212, 255, 0.2);
			color: white;
			border-radius: 8px;
			padding: 11px 14px;
			font-size: 0.9rem;
			width: 100%;
			outline: none;
			margin-bottom: 18px;
		}

		.form-input:focus {
			border-color: #00d4ff;
		}

		.form-input::placeholder {
			color: #7a8aaa;
		}

		.btn-submit {
			background: linear-gradient(135deg, #00d4ff, #7b61ff);
			border: none;
			border-radius: 8px;
			color: white;
			padding: 13px;
			width: 100%;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s;
			margin-top: 6px;
		}

		.btn-submit:hover {
			box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
			transform: translateY(-1px);
		}

		.alert-success {
			background: rgba(0, 255, 136, 0.08);
			border: 1px solid rgba(0, 255, 136, 0.25);
			color: #00ff88;
			border-radius: 8px;
			padding: 12px 16px;
			margin-bottom: 20px;
			font-size: 0.88rem;
		}

		.alert-error {
			background: rgba(255, 76, 106, 0.08);
			border: 1px solid rgba(255, 76, 106, 0.25);
			color: #ff4c6a;
			border-radius: 8px;
			padding: 12px 16px;
			margin-bottom: 20px;
			font-size: 0.88rem;
		}

		.btn-back-settings {
			display: block;
			width: 100%;
			text-align: center;

			margin-top: 12px;
			padding: 12px;

			border-radius: 8px;

			border: 1px solid rgba(0, 212, 255, 0.25);

			color: rgb(255, 255, 255);
			text-decoration: none;

			background: linear-gradient(135deg, #00d4ff, #7b61ff);

			font-weight: 600;
		}

		.btn-back-settings:hover {
			box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
			transform: translateY(-1px);
		}

		.password-wrap {
			position: relative;
		}

		.eye-btn {
			position: absolute;
			right: 12px;
			top: 12px;
			background: none;
			border: none;
			color: #7a8aaa;
			cursor: pointer;
			font-size: 0.9rem;
		}

		.eye-btn:hover {
			color: #00d4ff;
		}

		.user-dropdown {
			position: absolute;
			top: 60px;
			right: 30px;
			background: rgba(13, 21, 38, 0.98);
			border: 1px solid rgba(0, 212, 255, 0.2);
			border-radius: 12px;
			padding: 16px;
			width: 220px;
			display: none;
			z-index: 200;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
		}

		.user-dropdown.show {
			display: block;
		}

		.user-dropdown-name {
			color: white;
			font-weight: 600;
			margin-bottom: 4px;
		}

		.user-dropdown-role {
			color: #00d4ff;
			font-size: 0.78rem;
			margin-bottom: 14px;
			padding-bottom: 14px;
			border-bottom: 1px solid rgba(0, 212, 255, 0.1);
		}

		.dropdown-item-custom {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 12px;
			color: #e8f0fe;
			text-decoration: none;
			border-radius: 8px;
			font-size: 0.85rem;
		}

		.dropdown-item-custom:hover {
			background: rgba(0, 212, 255, 0.08);
			color: #00d4ff;
		}

		.dropdown-divider {
			border: none;
			border-top: 1px solid rgba(255, 255, 255, 0.06);
			margin: 8px 0;
		}

		.logout-btn {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 12px;
			color: #ff4c6a;
			background: none;
			border: none;
			width: 100%;
			cursor: pointer;
		}
		/* ================= MOBILE VIEW ================= */

		@media (max-width:768px){

		    .navbar-custom{
		        display:block;
		        padding:15px;
		        position:relative;
		    }

		    .nav-brand{
		        font-size:1.1rem;
		        margin-bottom:15px;
		        padding-right:60px;
		    }

		    .user-icon{
		        position:absolute;
		        top:12px;
		        right:15px;
		        width:42px;
		        height:42px;
		    }

		    .nav-right{
		        display:flex;
		        justify-content:center;
		        flex-wrap:wrap;
		        gap:8px;
		    }

		    .btn-nav{
		        flex:1;
		        min-width:130px;
		        text-align:center;
		        padding:8px 10px;
		        font-size:.8rem;
		    }

		    .user-dropdown{
		        top:65px;
		        right:10px;
		        width:220px;
		    }

		    .main-content{
		        padding:20px 15px;
		    }

		    .card{
		        padding:24px 18px;
		        max-width:100%;
		    }

		    .card-title{
		        font-size:1.25rem;
		    }

		    .card-sub{
		        font-size:.82rem;
		    }

		    .form-input{
		        font-size:.85rem;
		        padding:10px 12px;
		    }

		    .btn-submit,
		    .btn-back-settings{
		        font-size:.85rem;
		        padding:12px;
		    }

		    .eye-btn{
		        top:10px;
		    }
		}

		/* EXTRA SMALL PHONES */

		@media (max-width:480px){

		    .nav-brand{
		        font-size:1rem;
		    }

		    .btn-nav{
		        min-width:100%;
		    }

		    .card{
		        padding:20px 15px;
		    }

		    .card-title{
		        font-size:1.15rem;
		    }

		    .card-sub{
		        font-size:.78rem;
		    }

		    .form-label-custom{
		        font-size:.7rem;
		    }

		    .form-input{
		        font-size:.82rem;
		    }

		    .alert-success,
		    .alert-error{
		        font-size:.8rem;
		    }

		    .btn-submit,
		    .btn-back-settings{
		        font-size:.82rem;
		    }
		}
	</style>
</head>

<body>
	<div class="grid-bg"></div>

	<div class="navbar-custom">
		<div class="nav-brand">
			🛡️ CIPHER<span>SENTINEL</span>
		</div>

		<div class="nav-right">

			<a href="/dashboard" class="btn-nav">
				<i class="fas fa-home"></i> Dashboard
			</a>

			<a href="/settings" class="btn-nav">
				<i class="fas fa-cog"></i> Settings
			</a>

			<div class="user-icon" onclick="toggleDropdown()">

				<img th:if="${profilePic != null and profilePic != ''}" th:src="@{'/profile-images/' + ${profilePic}}"
					alt="Profile" class="navbar-profile-pic" />

				<i th:unless="${profilePic != null and profilePic != ''}" class="fas fa-user"></i>

			</div>
		</div>
	</div>
	<div class="user-dropdown" id="userDropdown">

		<div class="user-dropdown-name">
			👤
			<span th:text="${#authentication.name}">
				User
			</span>
		</div>

		<div class="user-dropdown-role">
			🛡️ CipherSentinel User
		</div>

		<a href="/dashboard" class="dropdown-item-custom">
			<i class="fas fa-home"></i> Dashboard
		</a>

		<a href="/upload" class="dropdown-item-custom">
			<i class="fas fa-upload"></i> Upload Document
		</a>

		<a href="/documents" class="dropdown-item-custom">
			<i class="fas fa-file-alt"></i> My Documents
		</a>

		<a href="/anomalies" class="dropdown-item-custom">
			<i class="fas fa-exclamation-triangle"></i> Anomalies
		</a>

		<a href="/audit" class="dropdown-item-custom">
			<i class="fas fa-history"></i> Audit Trail
		</a>
		<a th:if="${#authorization.expression('hasAuthority(''ADMIN'')')}" href="/admin" class="dropdown-item-custom">
			<i class="fas fa-user-shield"></i>
			Admin Dashboard
		</a>

		<a href="/profile" class="dropdown-item-custom">
			<i class="fas fa-user"></i> Profile
		</a>
		<a href="/change-password" class="dropdown-item-custom">
			<i class="fas fa-key"></i>
			Change Password
		</a>

		<a href="/about" class="dropdown-item-custom">
			<i class="fas fa-info-circle"></i> About Us
		</a>
		<a href="/settings" class="dropdown-item-custom">
			<i class="fas fa-cog"></i>
			Settings
		</a>

		<hr class="dropdown-divider" />

		<form th:action="@{/logout}" method="post">

			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

			<button type="submit" class="logout-btn">
				<i class="fas fa-sign-out-alt"></i>
				Logout
			</button>

		</form>

	</div>
	<div class="main-content">
		<div class="card">

			<div class="card-title">
				🔐 Change Password
			</div>
			<div class="card-sub">
				Enter your current password and choose a new one
			</div>

			<!-- Alerts -->
			<div th:if="${success}" class="alert-success">
				<i class="fas fa-check-circle" style="margin-right:8px;"></i>
				<span th:text="${success}"></span>
			</div>
			<div th:if="${error}" class="alert-error">
				<i class="fas fa-times-circle" style="margin-right:8px;"></i>
				<span th:text="${error}"></span>
			</div>

			<form th:action="@{/change-password}" method="post">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<!-- Current Password -->
				<label class="form-label-custom">
					Current Password
				</label>
				<div class="password-wrap">
					<input type="password" id="currentPwd" name="currentPassword" class="form-input"
						placeholder="Enter current password" />
					<button type="button" class="eye-btn" onclick="togglePwd('currentPwd', this)">
						<i class="fas fa-eye"></i>
					</button>
				</div>

				<!-- New Password -->
				<label class="form-label-custom">
					New Password
				</label>
				<div class="password-wrap">
					<input type="password" id="newPwd" name="newPassword" class="form-input"
						placeholder="Enter new password" />
					<button type="button" class="eye-btn" onclick="togglePwd('newPwd', this)">
						<i class="fas fa-eye"></i>
					</button>
				</div>

				<!-- Confirm Password -->
				<label class="form-label-custom">
					Confirm New Password
				</label>
				<div class="password-wrap">
					<input type="password" id="confirmPwd" name="confirmPassword" class="form-input"
						placeholder="Confirm new password" />
					<button type="button" class="eye-btn" onclick="togglePwd('confirmPwd', this)">
						<i class="fas fa-eye"></i>
					</button>
				</div>

				<button type="submit" class="btn-submit">
					<i class="fas fa-lock" style="margin-right:8px;"></i>
					Change Password
				</button>
			</form>

			<a href="/settings" class="btn-back-settings">
				<i class="fas fa-arrow-left"></i>
				Back to Settings
			</a>
		</div>
	</div>

	<script>
		function togglePwd(id, btn) {
			const input = document.getElementById(id);
			const icon = btn.querySelector('i');
			if (input.type === 'password') {
				input.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				input.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}

		function toggleDropdown() {

			document
				.getElementById("userDropdown")
				.classList.toggle("show");
		}

		document.addEventListener(
			"click",
			function (e) {

				const icon =
					document.querySelector(".user-icon");

				const dropdown =
					document.getElementById(
						"userDropdown"
					);

				if (
					icon &&
					!icon.contains(e.target) &&
					!dropdown.contains(e.target)
				) {
					dropdown.classList.remove(
						"show"
					);
				}
			}
		);


	</script>
</body>

</html>
