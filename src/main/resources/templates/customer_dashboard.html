<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Customer Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#eef3f8;
}

.card{
transition:.3s;
border:none;
border-radius:15px;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0px 10px 20px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">
Welcome,
<span th:text="${#authentication.name}"></span>
</h2>

<div class="row">

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body text-center">

<i class="fa-solid fa-building-columns fa-3x text-primary"></i>

<h4 class="mt-3">
Apply for Banking Service
</h4>

<p>
Apply for Home Loan,
Vehicle Loan,
Personal Loan,
Education Loan and more.
</p>

<a href="/apply" class="btn btn-primary">
Apply Now
</a>

</div>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body text-center">

<i class="fa-solid fa-folder-open fa-3x text-success"></i>

<h4 class="mt-3">
My Applications
</h4>

<p>
Track all submitted banking applications.
</p>

<a href="/my-applications"
class="btn btn-success">
View
</a>

</div>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body text-center">

<i class="fa-solid fa-user fa-3x text-warning"></i>

<h4 class="mt-3">
My Profile
</h4>

<p>
Update your profile
and account settings.
</p>

<a href="/profile"
class="btn btn-warning">
Profile
</a>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
