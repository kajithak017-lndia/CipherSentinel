<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit Document</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

	<style>
		body {
			background: #050914;
			color: white;
			font-family: 'Segoe UI';
		}

		.container-box {
			max-width: 1000px;
			margin: 40px auto;
			padding: 30px;
			background: #0d1323;
			border-radius: 15px;
			border: 1px solid rgba(255, 255, 255, .1);
		}

		textarea {
			width: 100%;
			height: 500px;
			background: #111827;
			color: white;
			border: 1px solid #2d3748;
			border-radius: 10px;
			padding: 15px;
			font-size: 14px;
		}

		.btn-save {
			margin-top: 20px;
			background: linear-gradient(135deg, #00ff88, #00d4ff);
			border: none;
			color: #000;
			font-weight: 700;
			padding: 12px 25px;
			border-radius: 10px;
		}

		.warning-box {
			background: rgba(255, 76, 106, .15);
			border-left: 4px solid #ff4c6a;
			padding: 15px;
			margin-bottom: 20px;
			border-radius: 10px;
		}
	</style>
</head>

<body>

	<div class="container-box">

		<h2>✏ Edit Document</h2>

		<div class="warning-box">

			<strong>Warning:</strong>

			Editing this document will modify
			the original uploaded file.

			During rescan, SHA-256 verification
			may detect tampering.

		</div>

		<form th:action="@{'/edit-document/' + ${document.id}}" method="post">

			<textarea name="content" th:text="${content}">
        </textarea>

			<br>

			<button type="submit" class="btn-save">

				Save Changes

			</button>

			<a th:href="@{'/view/' + ${document.id}}" class="btn btn-secondary ms-2">

				Cancel

			</a>

		</form>

	</div>

</body>

</html>
