<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - CipherSentinel</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#050914; min-height:100vh;
    display:flex; justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}
.grid-bg {
    position:fixed; top:0; left:0;
    width:100%; height:100%; z-index:0;
    background-image:
        linear-gradient(rgba(0,212,255,0.03)
            1px, transparent 1px),
        linear-gradient(90deg,
            rgba(0,212,255,0.03) 1px,
            transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}
.card {
    position:relative; z-index:1;
    background:rgba(13,21,38,0.95);
    border:1px solid rgba(0,212,255,0.3);
    border-radius:16px; padding:40px;
    width:420px;
    box-shadow:0 0 40px rgba(0,212,255,0.1);
}
.logo { text-align:center; margin-bottom:24px; }
.logo h1 {
    font-size:1.6rem; font-weight:800;
    color:#00d4ff; letter-spacing:2px;
}
.logo p { color:#7a8aaa; font-size:0.85rem; }
.divider {
    border:none;
    border-top:1px solid rgba(0,212,255,0.1);
    margin:16px 0;
}
.card-title {
    color:#00d4ff; font-size:1.2rem;
    font-weight:700; margin-bottom:6px;
    text-align:center;
}
.card-sub {
    color:#7a8aaa; font-size:0.85rem;
    margin-bottom:20px; text-align:center;
}
.form-label-custom {
    color:#7a8aaa; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:1px;
    margin-bottom:6px; display:block;
}
.input-wrap {
    position:relative; margin-bottom:16px;
}
.form-input {
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(0,212,255,0.2);
    color:white; border-radius:8px;
    padding:11px 40px 11px 14px;
    font-size:0.9rem; width:100%;
    outline:none; transition:all 0.2s;
}
.form-input:focus {
    border-color:#00d4ff;
}
.form-input::placeholder { color:#7a8aaa; }
.form-input option {
    background: #0d1526;
    color: white;
}

.form-input select {
    color: white;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
    -webkit-background-clip:text;
    -webkit-text-fill-color:#ffffff !important;
    transition:background-color 5000s
        ease-in-out 0s;
    box-shadow:inset 0 0 20px 20px
        rgba(13,21,38,0.95) !important;
}
.eye-btn {
    position:absolute; right:12px;
    top:50%; transform:translateY(-50%);
    background:none; border:none;
    color:#7a8aaa; cursor:pointer;
    font-size:0.9rem;
}
.eye-btn:hover { color:#00d4ff; }
.btn-submit {
    background:linear-gradient(135deg,
        #00d4ff, #7b61ff);
    border:none; border-radius:8px;
    color:white; font-weight:600;
    padding:12px; width:100%;
    letter-spacing:1px; transition:all 0.3s;
    cursor:pointer; font-size:0.9rem;
    margin-bottom:12px;
}
.btn-submit:hover {
    box-shadow:0 0 25px rgba(0,212,255,0.4);
    transform:translateY(-2px);
}
.alert-success {
    background:rgba(0,255,136,0.08);
    border:1px solid rgba(0,255,136,0.25);
    color:#00ff88; border-radius:8px;
    padding:12px 16px; margin-bottom:16px;
    font-size:0.85rem; text-align:center;
}
.alert-error {
    background:rgba(255,76,106,0.08);
    border:1px solid rgba(255,76,106,0.25);
    color:#ff4c6a; border-radius:8px;
    padding:12px 16px; margin-bottom:16px;
    font-size:0.85rem; text-align:center;
}
.bottom-links {
    text-align:center; margin-top:12px;
    color:#7a8aaa; font-size:0.85rem;
}
.bottom-links a {
    color:#00d4ff; text-decoration:none;
}

/* Steps */
.steps {
    display:flex; gap:8px;
    justify-content:center;
    margin-bottom:20px;
}
.step {
    display:flex; align-items:center;
    gap:6px; font-size:0.75rem;
    color:#7a8aaa;
}
.step-num {
    width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center;
    justify-content:center;
    font-size:0.7rem; font-weight:700;
    background:rgba(0,212,255,0.1);
    border:1px solid rgba(0,212,255,0.2);
    color:#00d4ff;
}
.step-num.active {
    background:#00d4ff;
    color:#050914;
}
.step-line {
    width:20px; height:1px;
    background:rgba(0,212,255,0.2);
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="card">
    <div class="logo">
        <h1>🛡️ CIPHER<span
            style="color:#7b61ff;">SENTINEL</span>
        </h1>
        <p>Password Recovery</p>
    </div>
    <hr class="divider"/>

    <div class="card-title">
        🔐 Forgot Password
    </div>
    <div class="card-sub">
        Enter your username and set a new password
    </div>

    <!-- Steps indicator -->
    <div class="steps">
        <div class="step">
            <div class="step-num active">1</div>
            <span>Username</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-num active">2</div>
            <span>New Password</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-num active">3</div>
            <span>Reset</span>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}"
         class="alert-success">
        <i class="fas fa-check-circle"
           style="margin-right:6px;">
        </i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}"
         class="alert-error">
        <i class="fas fa-times-circle"
           style="margin-right:6px;">
        </i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}"
          method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- Username -->
        <label class="form-label-custom">
            Username
        </label>
        <div class="input-wrap">
            <input type="text"
                   name="username"
                   class="form-input"
                   placeholder="Enter your username"
                   autocomplete="off"
                   required/>
        </div>
		<!-- Email -->
		<label class="form-label-custom">
		    Email Address
		</label>

		<div class="input-wrap">
		    <input type="email"
		           name="email"
		           class="form-input"
		           placeholder="Enter your registered email"
		           autocomplete="off"
		           required/>
		</div>
		<!-- Security Question -->
		<label class="form-label-custom">
		    Security Question
		</label>
		<div class="input-wrap">
		    <select name="securityQuestion"
		            class="form-input"
		            required>

		        <option value="">
		            Select Question
		        </option>

		        <option value="pet">
		            What is your first pet name?
		        </option>

		        <option value="school">
		            What is your school name?
		        </option>

		        <option value="city">
		            What is your birth city?
		        </option>

		    </select>
		</div>

		<!-- Security Answer -->
		<label class="form-label-custom">
		    Security Answer
		</label>
		<div class="input-wrap">
		    <input type="text"
		           name="securityAnswer"
		           class="form-input"
		           placeholder="Enter your security answer"
		           required/>
		</div>
        <!-- New Password -->
        <label class="form-label-custom">
            New Password
        </label>
        <div class="input-wrap">
            <input type="password"
                   id="newPwd"
                   name="newPassword"
                   class="form-input"
                   placeholder="Enter new password"
                   required/>
            <button type="button"
                    class="eye-btn"
                    onclick="togglePwd(
                        'newPwd', this)">
                <i class="fas fa-eye"></i>
            </button>
        </div>

        <!-- Confirm Password -->
        <label class="form-label-custom">
            Confirm New Password
        </label>
        <div class="input-wrap">
            <input type="password"
                   id="confirmPwd"
                   name="confirmPassword"
                   class="form-input"
                   placeholder="Confirm new password"
                   required/>
            <button type="button"
                    class="eye-btn"
                    onclick="togglePwd(
                        'confirmPwd', this)">
                <i class="fas fa-eye"></i>
            </button>
        </div>

        <button type="submit"
                class="btn-submit">
            <i class="fas fa-lock"
               style="margin-right:8px;">
            </i>
            RESET PASSWORD
        </button>
    </form>

    <div class="bottom-links">
        <a href="/login">← Back to Login</a>
        &nbsp;|&nbsp;
        <a href="/register">
            New user? Register
        </a>
    </div>
</div>

<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace(
            'fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace(
            'fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
