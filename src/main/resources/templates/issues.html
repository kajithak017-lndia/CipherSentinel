<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Issues - CipherSentinel</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #050914;
			color: white;
			font-family: 'Segoe UI', sans-serif;
			min-height: 100vh;
		}

		.grid-bg {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			background-image:
				linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
			background-size: 40px 40px;
			pointer-events: none;
		}

		.navbar-custom {
			background: rgba(13, 21, 38, 0.95);
			border-bottom: 1px solid rgba(0, 212, 255, 0.2);
			padding: 15px 30px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			position: sticky;
			top: 0;
			z-index: 100;
		}

		.nav-brand {
			font-size: 1.3rem;
			font-weight: 800;
			color: #00d4ff;
		}

		.nav-brand span {
			color: #7b61ff;
		}

		.btn-back {
			background: transparent;
			border: 1px solid rgba(0, 212, 255, 0.3);
			color: #00d4ff;
			padding: 6px 16px;
			border-radius: 6px;
			text-decoration: none;
			font-size: 0.85rem;
		}

		.main-content {
			position: relative;
			z-index: 1;
			padding: 30px;
		}

		.page-title {
			font-size: 1.5rem;
			font-weight: 700;
			color: #ff4c6a;
		}

		.doc-name {
			color: #00d4ff;
			font-size: 1rem;
			margin-bottom: 30px;
		}

		.issue-card {
			background: rgba(13, 21, 38, 0.9);
			border-left: 4px solid #ff4c6a;
			border-radius: 0 10px 10px 0;
			padding: 20px 24px;
			margin-bottom: 16px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.issue-left {}

		.issue-number {
			color: #7a8aaa;
			font-size: 0.75rem;
			letter-spacing: 2px;
			margin-bottom: 4px;
		}

		.issue-type {
			color: #ff4c6a;
			font-weight: 700;
			font-size: 1rem;
			margin-bottom: 6px;
		}

		.issue-desc {
			color: #e8f0fe;
			font-size: 0.85rem;
		}

		.severity-badge {
			padding: 6px 16px;
			border-radius: 20px;
			font-size: 0.8rem;
			font-weight: 700;
			flex-shrink: 0;
		}

		.high {
			background: rgba(255, 76, 106, 0.2);
			color: #ff4c6a;
			border: 1px solid rgba(255, 76, 106, 0.4);
		}

		.medium {
			background: rgba(255, 200, 0, 0.2);
			color: #ffc800;
			border: 1px solid rgba(255, 200, 0, 0.4);
		}

		.low {
			background: rgba(0, 255, 136, 0.2);
			color: #00ff88;
			border: 1px solid rgba(0, 255, 136, 0.4);
		}

		.safe-card {
			background: rgba(0, 255, 136, 0.05);
			border: 1px solid rgba(0, 255, 136, 0.2);
			border-radius: 12px;
			padding: 40px;
			text-align: center;
			color: #00ff88;
			font-size: 1.2rem;
		}

		.btn-rescan {
			background: linear-gradient(135deg, #ff4c6a, #7b61ff);
			border: none;
			border-radius: 8px;
			color: white;
			padding: 10px 24px;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 600;
			display: inline-block;
			margin-top: 20px;
			margin-right: 10px;
		}

		.btn-back {
			background: linear-gradient(135deg, #ff4c6a, #7b61ff);
			border: none;
			border-radius: 8px;
			color: white;
			padding: 10px 24px;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 600;
			display: inline-block;
			margin-top: 20px;
			margin-right: 10px;
		}
	</style>
</head>

<body>
	<div class="grid-bg"></div>
	<div class="navbar-custom">
		<div class="nav-brand">🛡️ CIPHER<span>SENTINEL</span></div>
		<a href="/documents" class="btn-back">← Documents</a>
	</div>
	<div class="main-content">
		<div class="page-title">🚨 Issues Found</div>
		<div class="doc-name" th:text="'File: ' + ${document.fileName}"></div>

		<div th:if="${issues.empty}" class="safe-card">
			✅ No issues found! Document is SAFE!
		</div>

		<div th:each="issue,i : ${issues}" class="issue-card">
			<div class="issue-left">
				<div class="issue-number" th:text="'ISSUE #' + ${i.count}"></div>
				<div class="issue-type" th:text="${issue.anomalyType}"></div>
				<div class="issue-desc" th:text="${issue.description}"></div>
			</div>
			<div>
				<span th:if="${issue.severity == 'HIGH'}" class="severity-badge high">HIGH</span>
				<span th:if="${issue.severity == 'MEDIUM'}" class="severity-badge medium">MEDIUM</span>
				<span th:if="${issue.severity == 'LOW'}" class="severity-badge low">LOW</span>
			</div>
		</div>

		<div>
			<a th:href="@{/rescan/{id}(id=${document.id})}" class="btn-rescan">🔄 Re-scan Document</a>
			<a href="/documents" class="btn-back">
				← Back
			</a>
		</div>
	</div>

</body>

</html>
