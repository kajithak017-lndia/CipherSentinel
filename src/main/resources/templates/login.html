<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - CipherSentinel</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #050914;
			color: white;
			font-family: 'Segoe UI', sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.grid-bg {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 0;

			background-image:
				linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);

			background-size: 40px 40px;
		}

		.login-card {
			position: relative;
			z-index: 1;

			width: 100%;
			max-width: 430px;

			background: #0d1526;
			border: 1px solid rgba(0, 212, 255, 0.2);

			border-radius: 18px;

			padding: 35px;
		}

		.logo {
			text-align: center;
			margin-bottom: 25px;
		}

		.logo h2 {
			color: #00d4ff;
			font-weight: 800;
		}

		.logo span {
			color: #7b61ff;
		}

		.sub-title {
			text-align: center;
			color: #7a8aaa;
			margin-bottom: 25px;
			font-size: 0.9rem;
		}

		.form-label {
			color: #7a8aaa;
			font-size: 0.78rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			margin-bottom: 8px;
		}

		.form-input {
			width: 100%;

			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(0, 212, 255, 0.2);

			color: white;

			border-radius: 8px;
			padding: 12px 14px;

			outline: none;
		}

		.form-input:focus {
			border-color: #00d4ff;
		}

		.form-input::placeholder {
			color: #7a8aaa;
		}

		/* Fix autofill background color */
		input:-webkit-autofill,
		input:-webkit-autofill:hover,
		input:-webkit-autofill:focus,
		input:-webkit-autofill:active {
			-webkit-background-clip: text;
			-webkit-text-fill-color: #ffffff !important;
			transition: background-color 5000s ease-in-out 0s;
			box-shadow: #7a8aaa !important;
		}

		.password-wrap {
			position: relative;
		}

		.eye-btn {
			position: absolute;
			top: 50%;
			right: 12px;
			transform: translateY(-50%);

			border: none;
			background: none;

			color: #7a8aaa;
			cursor: pointer;
		}

		.eye-btn:hover {
			color: #00d4ff;
		}

		.login-btn {
			width: 100%;

			background: linear-gradient(135deg,
					#00d4ff,
					#7b61ff);

			border: none;
			border-radius: 8px;

			color: white;
			font-weight: 600;

			padding: 12px;
			margin-top: 20px;

			cursor: pointer;
		}

		.login-btn:hover {
			box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
		}

		.alert-box {
			padding: 10px;
			border-radius: 8px;
			margin-bottom: 15px;
			font-size: 0.85rem;
		}

		.alert-error {
			background: rgba(255, 76, 106, 0.1);
			color: #ff4c6a;
			border: 1px solid rgba(255, 76, 106, 0.2);
		}

		.alert-success {
			background: rgba(0, 255, 136, 0.1);
			color: #00ff88;
			border: 1px solid rgba(0, 255, 136, 0.2);
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 15px;
		}

		.register-link {
			text-align: center;
			margin-top: 18px;
			color: #7a8aaa;
			font-size: 0.85rem;
		}

		.register-link a {
			color: #00d4ff;
			text-decoration: none;
		}

		.register-link a:hover {
			color: #7b61ff;
		}
	</style>
</head>

<body>

	<div class="grid-bg"></div>

	<div class="login-card">

		<div class="logo">
			<h2>🛡️ CIPHER<span>SENTINEL</span></h2>
		</div>

		<div class="sub-title">
			Secure Document Verification System
		</div>

		<!-- Login Error -->
		<!-- Deactivated Account Message -->

		<div th:if="${param.error}" class="alert-box alert-error"
			style="background:rgba(255,76,106,0.08);
			border:1px solid rgba(255,76,106,0.25);
			color:#ff4c6a; border-radius:8px;
			padding:12px 16px; margin-bottom:16px;
			font-size:0.85rem; text-align:center;">
			<i class="fas fa-times-circle" style="margin-right:6px;"></i>
			Invalid username or password.
			Account may be deactivated.
		</div>

		<!-- Logout Success -->

		<div id="logoutMsg" th:if="${param.logout}" class="alert-success">
			Logged out successfully
		</div>

		<form th:action="@{/login}" method="post">

			<!-- Username -->

			<div class="mb-3">

				<label class="form-label">
					Email ID
				</label>
				

				<input type="email"
				       name="username"
				       class="form-input"
				       placeholder="Enter Email"
				       required/>
			</div>

			<!-- Password -->

			<div class="mb-3">

				<label class="form-label">
					Password
				</label>

				<div class="password-wrap">

					<input type="password" id="password" name="password" class="form-input" placeholder="Enter password"
						required>

					<button type="button" class="eye-btn" onclick="togglePassword()">

						<i id="eyeIcon" class="fas fa-eye"></i>

					</button>

				</div>
				<div style="text-align:right;
			            margin-top:-10px;
			            margin-bottom:16px;">
					<a href="/forgot-password" style="color:#7a8aaa;
			              font-size:0.8rem;
			              text-decoration:none;">
						Forgot Password?
					</a>
				</div>

			</div>

			<button type="submit" class="login-btn">

				<i class="fas fa-sign-in-alt"></i>
				Login

			</button>

		</form>

		<div class="register-link">
			Don't have an account?
			<a th:href="@{/register}">
				Register
			</a>
		</div>

	</div>

	<script>

		function togglePassword() {

			const password =
				document.getElementById("password");

			const eyeIcon =
				document.getElementById("eyeIcon");

			if (password.type === "password") {

				password.type = "text";

				eyeIcon.classList.remove("fa-eye");
				eyeIcon.classList.add("fa-eye-slash");

			} else {

				password.type = "password";

				eyeIcon.classList.remove("fa-eye-slash");
				eyeIcon.classList.add("fa-eye");
			}
		}

		window.addEventListener("load", function () {

			const msg = document.getElementById("logoutMsg");

			if (msg) {

				setTimeout(() => {

					msg.style.display = "none";

					// Remove ?logout from URL
					window.history.replaceState(
						{},
						document.title,
						window.location.pathname
					);

				}, 3000);

			}

		});


	</script>

</body>

</html>
