<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CipherSentinel</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#050914; min-height:100vh;
    display:flex; justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}
.grid-bg {
    position:fixed; top:0; left:0;
    width:100%; height:100%; z-index:0;
    background-image:
        linear-gradient(rgba(0,212,255,0.03)
            1px, transparent 1px),
        linear-gradient(90deg,
            rgba(0,212,255,0.03) 1px,
            transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}
.register-card {
    position:relative; z-index:1;
    background:rgba(13,21,38,0.95);
    border:1px solid rgba(0,212,255,0.3);
    border-radius:16px; padding:40px;
    width:420px;
    box-shadow:0 0 40px rgba(0,212,255,0.1);
}
.logo { text-align:center; margin-bottom:24px; }
.logo h1 {
    font-size:1.6rem; font-weight:800;
    color:#00d4ff; letter-spacing:2px;
}
.logo p { color:#7a8aaa; font-size:0.85rem; }
.divider {
    border:none;
    border-top:1px solid rgba(0,212,255,0.1);
    margin:16px 0;
}
.form-label-custom {
    color:#7a8aaa; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:1px;
    margin-bottom:6px; display:block;
}
.input-wrap { position:relative; margin-bottom:16px; }
.form-control-custom {
    background:rgba(255,255,255,0.05) !important;
    border:1px solid rgba(0,212,255,0.2) !important;
    color:white !important; border-radius:8px;
    padding:11px 40px 11px 14px;
    font-size:0.9rem; width:100%;
    outline:none; transition:all 0.2s;
}
select.form-control-custom {
    color: white !important;
}

select.form-control-custom option {
    background: #0d1526;
    color: white;
}
.form-control-custom:focus {
    border-color:#00d4ff !important;
    box-shadow:0 0 0 3px
        rgba(0,212,255,0.1) !important;
}
.form-control-custom::placeholder {
    color:#7a8aaa !important;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
    -webkit-background-clip:text;
    -webkit-text-fill-color:#ffffff !important;
    transition:background-color 5000s ease-in-out 0s;
    box-shadow:inset 0 0 20px 20px
        rgba(13,21,38,0.95) !important;
}
.eye-btn {
    position:absolute; right:12px;
    top:50%; transform:translateY(-50%);
    background:none; border:none;
    color:#7a8aaa; cursor:pointer;
    font-size:0.9rem; z-index:2;
    transition:color 0.2s;
}
.eye-btn:hover { color:#00d4ff; }
.role-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px; margin-bottom:16px;
}
.role-option {
    position:relative;
}
.role-option input {
    position:absolute; opacity:0;
    width:0; height:0;
}
.role-label {
    display:flex; flex-direction:column;
    align-items:center; gap:4px;
    padding:10px 6px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,212,255,0.15);
    border-radius:8px; cursor:pointer;
    transition:all 0.2s;
    text-align:center;
}
.role-label:hover {
    border-color:rgba(0,212,255,0.4);
    background:rgba(0,212,255,0.05);
}
.role-option input:checked + .role-label {
    border-color:#00d4ff;
    background:rgba(0,212,255,0.1);
}
.role-icon { font-size:1.2rem; }
.role-name {
    color:#e8f0fe; font-size:0.72rem;
    font-weight:600; letter-spacing:0.5px;
}
.role-desc {
    color:#7a8aaa; font-size:0.62rem;
}
.btn-register {
    background:linear-gradient(135deg,
        #7b61ff, #00d4ff);
    border:none; border-radius:8px;
    color:white; font-weight:600;
    padding:12px; width:100%;
    letter-spacing:1px; transition:all 0.3s;
    cursor:pointer; font-size:0.9rem;
}
.btn-register:hover {
    box-shadow:0 0 25px rgba(123,97,255,0.4);
    transform:translateY(-2px);
}
.login-link {
    text-align:center; margin-top:16px;
    color:#7a8aaa; font-size:0.88rem;
}
.login-link a {
    color:#00d4ff; text-decoration:none;
}
.role-info {
    background:rgba(0,212,255,0.05);
    border:1px solid rgba(0,212,255,0.15);
    border-radius:8px; padding:10px 14px;
    margin-bottom:16px; font-size:0.78rem;
    color:#7a8aaa; display:none;
}
.role-info.show { display:block; }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="register-card">
    <div class="logo">
        <h1>🛡️ CIPHER<span
            style="color:#7b61ff">SENTINEL</span>
        </h1>
        <p>Create your account</p>
		</div>
		<hr class="divider"/>

		<!-- ERROR MESSAGE -->
		<div th:if="${error}"
		     style="
		     background:rgba(255,76,106,0.08);
		     border:1px solid rgba(255,76,106,0.25);
		     color:#ff4c6a;
		     border-radius:8px;
		     padding:12px;
		     margin-bottom:16px;
		     text-align:center;">
		    <span th:text="${error}"></span>
		</div>

		<form th:action="@{/register}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- Username -->
        <label class="form-label-custom">
            Username
        </label>
        <div class="input-wrap">
            <input type="text"
                   name="username"
                   class="form-control-custom"
                   placeholder="Choose a username"
                   autocomplete="off"
                   required/>
        </div>
		
		
		<label class="form-label-custom">
		    Email
		</label>
		<div class="input-wrap">
		    <input type="email"
		           name="email"
		           class="form-control-custom"
		           placeholder="Enter your email"
		           required/>
		</div>

		<label class="form-label-custom">
		    Security Question
		</label>

		<select name="securityQuestion"
		        class="form-control-custom"
		        required>
		    <option value="">
		        Select Question
		    </option>

		    <option value="pet">
		        What is your first pet name?
		    </option>

		    <option value="school">
		        What is your school name?
		    </option>

		    <option value="city">
		        What is your birth city?
		    </option>
		</select>

		<label class="form-label-custom">
		    Security Answer
		</label>

		<div class="input-wrap">
		    <input type="text"
		           name="securityAnswer"
		           class="form-control-custom"
		           placeholder="Enter answer"
		           required/>
		</div>

        <!-- Password -->
        <label class="form-label-custom">
            Password
        </label>
        <div class="input-wrap">
            <input type="password"
                   id="regPassword"
                   name="password"
                   class="form-control-custom"
                   placeholder="Choose a password"
                   autocomplete="new-password"
                   required/>
            <button type="button"
                    class="eye-btn"
                    onclick="togglePwd(
                        'regPassword', this)">
                <i class="fas fa-eye"></i>
            </button>
        </div>

		<!-- Replace role-grid with this -->
		<div style="background:rgba(0,212,255,0.05);
		            border:1px solid rgba(0,212,255,0.15);
		            border-radius:8px;
		            padding:12px 16px;
		            margin-bottom:16px;
		            display:flex;
		            align-items:center;
		            gap:10px;">
		    <span style="font-size:1.2rem;">👤</span>
		    <div>
		        <div style="color:#00d4ff;
		                    font-size:0.82rem;
		                    font-weight:600;
		                    margin-bottom:2px;">
		            Default Role: USER
		        </div>
		        <div style="color:#7a8aaa;
		                    font-size:0.75rem;">
		            Role can be upgraded by Admin
		            after registration
		        </div>
		    </div>
		</div>

        <!-- Role Info Box -->
        <div class="role-info" id="roleInfo">
        </div>

        <button type="submit"
                class="btn-register">
            REGISTER →
        </button>
    </form>

    <div class="login-link">
        Already have account?
        <a href="/login">Login here</a>
    </div>
</div>

<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace(
            'fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace(
            'fa-eye-slash', 'fa-eye');
    }
}


// Show default role info on load
window.onload = function() {
    showRoleInfo({ value: 'USER' });
};
</script>
</body>
</html>
